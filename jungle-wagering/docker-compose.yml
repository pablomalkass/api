name: wagering

# Three identical application instances (app-1..3) share ONE PostgreSQL and ONE SQS: each of them runs the HTTP API,
# the queue consumer, the outbox publisher and the pending-reference worker. Correctness never depends on how many
# are up (see ARCHITECTURE.md).
#
# LocalStack is pinned to a community release that needs no auth token. MiniStack can replace it: point
# SQS_ENDPOINT at it and create the same queues (infra/localstack/init-queues.sh is plain `aws sqs` calls).

x-app-environment: &app-environment
  DATABASE_URL: postgres://${POSTGRES_USER:-wagering_app}:${POSTGRES_PASSWORD:-wagering_app}@postgres:5432/${POSTGRES_DB:-wagering}
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  SQS_ENDPOINT: http://localstack:4566
  LOG_LEVEL: info
  PORT: "3000"

x-app: &app
  build: .
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    localstack:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  environment: *app-environment
  stop_grace_period: 40s # > SHUTDOWN_TIMEOUT_MS (25s): in-flight messages finish on SIGTERM
  healthcheck:
    test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 15s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wagering # schema owner: runs the migrations
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro # creates the least-privilege application role
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: sqs
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/10-queues.sh:ro
    healthcheck:
      # healthy only once the init script created the LAST queue
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name wager-events.fifo"]
      interval: 3s
      timeout: 5s
      retries: 40

  migrate:
    build: .
    command: ["bun", "src/cli/migrate.ts", "up"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-wagering}:${POSTGRES_PASSWORD:-wagering}@postgres:5432/${POSTGRES_DB:-wagering}
    restart: "no"

  app-1:
    <<: *app
    ports:
      - "3001:3000"

  app-2:
    <<: *app
    ports:
      - "3002:3000"

  app-3:
    <<: *app
    ports:
      - "3003:3000"

volumes:
  pgdata:
